<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Excalibur Proxy — finalize your purchase</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;max-width:680px;margin:48px auto;padding:0 16px;color:#111;line-height:1.55}
  h1{font-size:28px}
  #status{padding:14px;border-radius:6px;margin:20px 0}
  .err{background:#fde8e8;color:#9b1c1c}
  .pending{background:#fff7e0;color:#8a5b00}
</style>
</head>
<body>
<h1>Finalizing your Excalibur subscription…</h1>
<div id="status" class="pending">Redirecting to the fulfillment dispatcher…</div>
<noscript>JavaScript is required to complete the purchase. Please re-open this link in a browser with JavaScript enabled, or contact <a href="mailto:support@getexcalibur.com">support@getexcalibur.com</a> with your marketplace token.</noscript>
<script>
(function () {
  var DISPATCHER = 'https://excalibur-fulfillment-dispatcher.xclbr.workers.dev';
  var qs = new URLSearchParams(location.search);
  var awsToken = qs.get('x-amzn-marketplace-token');
  var azureToken = qs.get('token');
  var pathHint = location.pathname.toLowerCase();
  var st = document.getElementById('status');

  var target = null;
  if (awsToken || pathHint.indexOf('/aws') !== -1) {
    target = DISPATCHER + '/aws?x-amzn-marketplace-token=' + encodeURIComponent(awsToken || azureToken || '');
  } else if (azureToken || pathHint.indexOf('/azure') !== -1) {
    target = DISPATCHER + '/azure?token=' + encodeURIComponent(azureToken || '');
  }

  if (!target) {
    st.className = 'err';
    st.innerHTML = 'No marketplace token in URL. This page is reached automatically after subscribing on AWS Marketplace or Azure Marketplace. If you arrived here directly, please return to your marketplace listing.';
    return;
  }

  location.replace(target);
})();
</script>
</body>
</html>
