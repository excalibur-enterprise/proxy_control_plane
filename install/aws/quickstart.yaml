AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Excalibur Proxy — Quick-Start. Deploys a single-node proxy on a
  t3.small EC2 instance in your default VPC. The license bundle is
  fetched from the URL you received after subscribing in AWS Marketplace
  (LicenseUrl parameter is prefilled by the fulfillment page).

Parameters:
  LicenseUrl:
    Type: String
    Description: >
      Public URL of your signed license bundle (provided by the
      Excalibur fulfillment page after Marketplace subscription).
    AllowedPattern: ^https://.+\.json$
    ConstraintDescription: must be an https:// URL ending in .json

  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium, t3.large, m6i.large, m6i.xlarge]
    Description: EC2 instance size.

  SshKeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair for SSH access (optional but recommended).

  AllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to reach the proxy (HTTPS:8443). Restrict for production.
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$

Mappings:
  # Amazon Linux 2023 minimal x86_64 — keep current per region.
  RegionMap:
    us-east-1:      { AMI: ami-0c02fb55956c7d316 }
    us-east-2:      { AMI: ami-05fb0b8c1424f266b }
    us-west-1:      { AMI: ami-0d9858aa3c6322f73 }
    us-west-2:      { AMI: ami-098e42ae54c764c35 }
    eu-west-1:      { AMI: ami-0d71ea30463e0ff8d }
    eu-central-1:   { AMI: ami-04e601abe3e1a910f }
    ap-southeast-1: { AMI: ami-0df7a207adb9748c7 }
    ap-northeast-1: { AMI: ami-0d52744d6551d851e }

Resources:
  ProxySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Excalibur Proxy — inbound HTTPS + optional SSH
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8443
          ToPort: 8443
          CidrIp: !Ref AllowedCidr
          Description: Excalibur Proxy HTTPS
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedCidr
          Description: SSH (optional)
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Egress (outbound to backends + license refresh)

  ProxyInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !FindInMap [RegionMap, !Ref AWS::Region, AMI]
      KeyName: !Ref SshKeyName
      SecurityGroupIds: [!Ref ProxySecurityGroup]
      Tags:
        - Key: Name
          Value: excalibur-proxy
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf update -y
          dnf install -y docker
          systemctl enable --now docker
          # Pull and run; the proxy fetches its license from LicenseUrl
          # on startup and caches it to /etc/excalibur/license.jws.
          mkdir -p /etc/excalibur
          docker run -d \
            --name excalibur-proxy \
            --restart=unless-stopped \
            -p 8443:8443 \
            -e EXCALIBUR_LICENSE_URL='${LicenseUrl}' \
            -v /etc/excalibur:/etc/excalibur \
            ghcr.io/excalibur-enterprise/proxy:latest

Outputs:
  PublicEndpoint:
    Description: Public HTTPS endpoint of your Excalibur Proxy
    Value: !Sub "https://${ProxyInstance.PublicDnsName}:8443"
  InstanceId:
    Description: EC2 instance ID
    Value: !Ref ProxyInstance
  LicenseUrl:
    Description: License URL the proxy is using
    Value: !Ref LicenseUrl
