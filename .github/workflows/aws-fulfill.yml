name: aws-fulfill

# Triggered by the public landing page (pages/landing.html) when an
# AWS Marketplace customer completes a purchase. The dispatcher
# forwards the one-time `x-amzn-marketplace-token` registration token
# as `client_payload.token`. This workflow:
#   1. Calls aws marketplace-metering resolve-customer to exchange
#      the token for the durable CustomerIdentifier + ProductCode.
#   2. Builds and runs cmd/fulfill-aws against the resolved IDs to
#      sign a license bundle with the operational private key.
#   3. Commits the bundle to entitlements/aws/<sub>.json so the
#      static site at https://excalibur.dev/entitlements/aws/<sub>.json
#      serves it on the next release-pages run.
#
# Operators can also dispatch this workflow manually with an explicit
# customer_id + product_code (skipping the token exchange) — useful
# for re-issuing a bundle without forcing the customer to re-purchase.
#
# Security posture (mirrors azure-fulfill.yml):
#   - `signing` environment requires a manual reviewer for every run.
#   - The operational private key is a GitHub Encrypted Secret named
#     OPS_PRIV_KEY_B64 (raw 64-byte ed25519 key, base64-std). Shared
#     with the Azure path — one signing key per control plane.
#   - AWS auth is GitHub OIDC -> IAM role via
#     aws-actions/configure-aws-credentials@v4. **No long-lived AWS
#     keys in GitHub secrets** — only the seller-account role ARN
#     (repository variable AWS_FULFILL_ROLE_ARN).
#   - The job runs on `ubuntu-latest` with `permissions: contents:
#     write` + `id-token: write` (the latter for AWS OIDC), both
#     scoped to this single workflow.
#   - Every action is pinned to a SHA, never a tag.

on:
  repository_dispatch:
    types: [aws-fulfill]
  workflow_dispatch:
    inputs:
      token:
        description: "AWS Marketplace one-time registration token (x-amzn-marketplace-token). Leave blank if providing customer_id + product_code directly."
        required: false
      customer_id:
        description: "AWS Marketplace CustomerIdentifier (skip token exchange when set)"
        required: false
      product_code:
        description: "AWS Marketplace ProductCode (skip token exchange when set)"
        required: false
      region:
        description: "AWS region for the entitlement-service endpoint"
        required: false
        default: "us-east-1"

permissions:
  contents: write
  id-token: write

concurrency:
  group: aws-fulfill-${{ github.event.client_payload.token || github.event.client_payload.customer_id || inputs.token || inputs.customer_id }}
  cancel-in-progress: false

jobs:
  fulfill-and-sign:
    runs-on: ubuntu-latest
    environment: signing
    timeout-minutes: 5
    steps:
      - name: Checkout control-plane
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Checkout proxy (for cmd/fulfill-aws)
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          repository: excalibur-enterprise/proxy
          path: proxy
          ref: main

      - name: Set up Go
        uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5.0.1
        with:
          go-version-file: proxy/go.mod
          cache-dependency-path: proxy/go.sum

      - name: Configure AWS credentials (GitHub OIDC -> IAM role)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_FULFILL_ROLE_ARN }}
          role-session-name: aws-fulfill-${{ github.run_id }}
          aws-region: ${{ github.event.client_payload.region || inputs.region || 'us-east-1' }}
          mask-aws-account-id: true

      - name: Resolve registration token
        id: resolve
        env:
          DISPATCH_TOKEN: ${{ github.event.client_payload.token || inputs.token }}
          DISPATCH_CUSTOMER_ID: ${{ github.event.client_payload.customer_id || inputs.customer_id }}
          DISPATCH_PRODUCT_CODE: ${{ github.event.client_payload.product_code || inputs.product_code }}
        run: |
          set -euo pipefail
          if [[ -n "${DISPATCH_CUSTOMER_ID:-}" && -n "${DISPATCH_PRODUCT_CODE:-}" ]]; then
            echo "Using explicit customer_id + product_code from dispatch input."
            echo "customer_id=${DISPATCH_CUSTOMER_ID}" >> "$GITHUB_OUTPUT"
            echo "product_code=${DISPATCH_PRODUCT_CODE}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${DISPATCH_TOKEN:-}" ]]; then
            echo "::error::Neither token nor (customer_id + product_code) provided in dispatch payload."
            exit 1
          fi
          echo "Exchanging registration token via aws marketplace-metering resolve-customer."
          RESOLVED=$(aws marketplace-metering resolve-customer \
            --registration-token "$DISPATCH_TOKEN" \
            --output json)
          CUSTOMER_ID=$(echo "$RESOLVED" | jq -r '.CustomerIdentifier')
          PRODUCT_CODE=$(echo "$RESOLVED" | jq -r '.ProductCode')
          if [[ -z "$CUSTOMER_ID" || "$CUSTOMER_ID" == "null" ]]; then
            echo "::error::resolve-customer returned no CustomerIdentifier."
            exit 1
          fi
          echo "::add-mask::$CUSTOMER_ID"
          echo "customer_id=$CUSTOMER_ID" >> "$GITHUB_OUTPUT"
          echo "product_code=$PRODUCT_CODE" >> "$GITHUB_OUTPUT"

      - name: Build fulfill-aws
        working-directory: proxy
        run: go build -o ../fulfill-aws ./cmd/fulfill-aws

      - name: Materialize signing material
        env:
          OPS_PRIV_KEY_B64: ${{ secrets.OPS_PRIV_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$OPS_PRIV_KEY_B64" > op.priv
          cp pages/signing-keys/operational-cert.json op.cert.json
          jq -r '.token' op.cert.json > op.cert
          test -s op.cert

      - name: Resolve entitlement, sign bundle
        id: sign
        env:
          CUSTOMER_ID: ${{ steps.resolve.outputs.customer_id }}
          PRODUCT_CODE: ${{ steps.resolve.outputs.product_code }}
          REGION: ${{ github.event.client_payload.region || inputs.region || 'us-east-1' }}
        run: |
          set -euo pipefail
          ./fulfill-aws \
            --customer-id "$CUSTOMER_ID" \
            --product-code "$PRODUCT_CODE" \
            --region "$REGION" \
            --op-priv op.priv \
            --op-cert op.cert \
            --plans proxy/deploy/aws/marketplace/plans-aws.json \
            --validity-days 90 \
            --grace-days 14 \
            --out bundle.json
          SUB=$(jq -r '.license' bundle.json | cut -d. -f1 | base64 -d 2>/dev/null | jq -r .sub)
          test -n "$SUB" && test "$SUB" != "null"
          echo "sub=$SUB" >> "$GITHUB_OUTPUT"
          mkdir -p entitlements/aws
          mv bundle.json "entitlements/aws/${SUB}.json"

      - name: Wipe signing material
        if: always()
        run: shred -u op.priv op.cert op.cert.json 2>/dev/null || rm -f op.priv op.cert op.cert.json

      - name: Commit and push
        env:
          SUB: ${{ steps.sign.outputs.sub }}
        run: |
          set -euo pipefail
          git config user.name  "excalibur-fulfillment[bot]"
          git config user.email "fulfillment@excalibur.dev"
          git add "entitlements/aws/${SUB}.json"
          git commit -m "fulfill: issue aws license for ${SUB}"
          git push
