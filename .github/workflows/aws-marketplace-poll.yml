name: aws-marketplace-poll

# Every 5 minutes, diff AWS Marketplace's authoritative entitlement
# state against the bundles we have committed under entitlements/aws/.
# Reissue licenses whose Exp is within 7 days; suspend (delete bundle)
# any customer whose entitlement is no longer active.
#
# All signing happens via cmd/fulfill-aws under the same `signing`
# environment as aws-fulfill.yml. This workflow only enumerates +
# decides; the signing step is delegated.
#
# AWS auth: GitHub OIDC -> IAM role via configure-aws-credentials.
# No long-lived AWS keys.

on:
  # Cron disabled until OPS_PRIV_KEY_B64, AWS_FULFILL_ROLE_ARN, the
  # signing environment, and the proxy source repo are all configured.
  # Re-enable by uncommenting the schedule block.
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: aws-marketplace-poll
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: signing
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Checkout proxy
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          repository: excalibur-enterprise/proxy
          path: proxy
          ref: main

      - name: Set up Go
        uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5.0.1
        with:
          go-version-file: proxy/go.mod
          cache-dependency-path: proxy/go.sum

      - name: Configure AWS credentials (GitHub OIDC -> IAM role)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_FULFILL_ROLE_ARN }}
          role-session-name: aws-poll-${{ github.run_id }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Materialize signing material
        env:
          OPS_PRIV_KEY_B64: ${{ secrets.OPS_PRIV_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$OPS_PRIV_KEY_B64" > op.priv
          jq -r '.token' pages/signing-keys/operational-cert.json > op.cert

      - name: Build fulfill-aws
        working-directory: proxy
        run: go build -o ../fulfill-aws ./cmd/fulfill-aws

      - name: Reconcile entitlements
        env:
          AWS_PRODUCT_CODE: ${{ vars.AWS_PRODUCT_CODE }}
          AWS_REGION: us-east-1
        run: |
          set -euo pipefail

          mkdir -p entitlements/aws

          NOW=$(date -u +%s)
          CUTOFF=$((NOW + 7*24*3600))

          # Walk every bundle we currently hold and ask the entitlement
          # service whether the customer is still active. AWS does not
          # expose a "list all customers for this product" API
          # (entitlements are keyed BY customer); we therefore source the
          # customer set from our own committed bundles. New customers
          # are added by aws-fulfill.yml, not by this poll loop.
          shopt -s nullglob
          for path in entitlements/aws/*.json; do
            sub=$(basename "$path" .json)
            EXP=$(jq -r '.license' "$path" | cut -d. -f1 | base64 -d 2>/dev/null | jq -r .exp)
            # Cheap probe: call fulfill-aws in --probe mode; on
            # ErrNoEntitlement (rc=3) we suspend, on success we reissue
            # iff EXP is within the 7-day window.
            set +e
            ./fulfill-aws \
              --customer-id "$sub" \
              --product-code "$AWS_PRODUCT_CODE" \
              --region "$AWS_REGION" \
              --op-priv op.priv --op-cert op.cert \
              --plans proxy/deploy/aws/marketplace/plans-aws.json \
              --validity-days 90 --grace-days 14 \
              --out probe.json
            rc=$?
            set -e

            if [[ $rc -eq 3 ]]; then
              echo "[poll] suspending ${sub} (no active entitlement)"
              git rm "$path"
              rm -f probe.json
              continue
            fi
            if [[ $rc -ne 0 ]]; then
              echo "[poll] WARNING: fulfill-aws rc=$rc for ${sub}; leaving bundle untouched" >&2
              rm -f probe.json
              continue
            fi

            if [[ "$EXP" -gt "$CUTOFF" ]]; then
              # Still fresh; throw away the probe.
              rm -f probe.json
              continue
            fi

            echo "[poll] reissuing ${sub} (exp=$EXP, cutoff=$CUTOFF)"
            mv probe.json "$path"
          done

          shred -u op.priv op.cert 2>/dev/null || rm -f op.priv op.cert

      - name: Commit changes (if any)
        run: |
          set -euo pipefail
          if git diff --cached --quiet && git diff --quiet; then
            echo "[poll] no changes"
            exit 0
          fi
          git config user.name  "excalibur-fulfillment[bot]"
          git config user.email "fulfillment@excalibur.dev"
          git add -A entitlements/aws/
          git commit -m "poll: reconcile aws entitlements vs marketplace state"
          git push
