name: release-pages

# Publishes pages/ and bundles/ to the gh-pages branch on every push
# to main. Pages are served at https://excalibur-enterprise.github.io/proxy_control_plane (CNAME ->
# <org>.github.io) and https://excalibur-enterprise.github.io/proxy_control_plane (same site,
# different subdomain mapping).

on:
  push:
    branches: [main]
    paths:
      - pages/**
      - bundles/**
      - entitlements/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir _site
          cp -r pages/* _site/
          if [[ -d bundles ]]; then
            cp -r bundles _site/
          fi
          if [[ -d entitlements ]]; then
            cp -r entitlements _site/
          fi
          # Custom domain (CNAME) intentionally not written: site is
          # served at the default https://<org>.github.io/<repo>/ URL.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
