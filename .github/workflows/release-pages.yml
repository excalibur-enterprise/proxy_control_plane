name: release-pages

# Publishes pages/ and bundles/ to the gh-pages branch on every push
# to main. Pages are served at https://excalibur.dev (CNAME ->
# <org>.github.io) and https://entitlements.excalibur.dev (same site,
# different subdomain mapping).

on:
  push:
    branches: [main]
    paths:
      - pages/**
      - bundles/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir _site
          cp -r pages/* _site/
          if [[ -d bundles ]]; then
            cp -r bundles _site/
          fi
          # CNAME file for custom domain.
          echo "excalibur.dev" > _site/CNAME
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
